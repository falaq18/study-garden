name: Daily fresh links

on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 am India time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily-links.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch newest links
        run: python scripts/fetch_links.py
      - name: Commit if changed
        run: |
          git config user.name "pip-the-sprout"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.json audit-log.jsonl
          git diff --cached --quiet || git commit -m "Fresh links for $(date -u +%F)"
          git push
